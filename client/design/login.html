<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login | CognitiveFlow</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#d4ebff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-surface-variant": "#464555",
                        "on-surface": "#171c1f",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#d3e4fe",
                        "on-secondary-container": "#54647a",
                        "on-primary-container": "#e9e5ff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-primary-fixed-variant": "#3424ca",
                        "surface-dim": "#d6dade",
                        "surface-container-high": "#e4e9ed",
                        "surface-bright": "#f6fafe",
                        "on-background": "#171c1f",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "inverse-surface": "#2c3134",
                        "inverse-on-surface": "#edf1f5",
                        "tertiary": "#00567c",
                        "secondary": "#505f76",
                        "primary": "#3e32d3",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#89ceff",
                        "surface-variant": "#dfe3e7",
                        "on-primary-fixed": "#0f0069",
                        "surface-container": "#eaeef2",
                        "tertiary-fixed": "#c9e6ff",
                        "surface": "#f6fafe",
                        "secondary-container": "#d0e1fb",
                        "outline": "#777587",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-container-low": "#f0f4f8",
                        "background": "#f6fafe",
                        "surface-tint": "#4e44e2",
                        "outline-variant": "#c7c4d8",
                        "on-error": "#ffffff",
                        "primary-container": "#5850ec",
                        "on-tertiary-fixed": "#001e2f",
                        "inverse-primary": "#c3c0ff",
                        "surface-container-highest": "#dfe3e7",
                        "primary-fixed": "#e2dfff",
                        "error": "#ba1a1a",
                        "tertiary-container": "#006f9f",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#c3c0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .ambient-shadow {
            shadow: 0 12px 32px rgba(62, 50, 211, 0.08);
        }

        .primary-gradient {
            background: linear-gradient(135deg, #3e32d3 0%, #5850ec 100%);
        }

        .ghost-border {
            outline: 1px solid rgba(199, 196, 216, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        .brand-logo {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4 md:p-0 overflow-hidden">
    <!-- Login Container -->
    <main
        class="w-full max-w-[1440px] h-full md:h-[921px] flex flex-col md:flex-row bg-surface-container-lowest rounded-[2rem] overflow-hidden shadow-[0_12px_32px_rgba(62,50,211,0.08)] ghost-border">
        <!-- Left Side: Visual & Brand (Architectural Layer) -->
        <section class="hidden md:flex flex-col justify-between w-full md:w-1/2 p-12 bg-surface-container-low relative">
            <div class="z-10">
                <div class="brand-logo text-3xl font-black text-primary tracking-tighter mb-12">CognitiveFlow</div>
                <h1 class="text-[3.5rem] font-extrabold leading-[1.1] tracking-[-0.02em] text-on-surface max-w-md">
                    Architect your <span class="text-primary-container">workflow</span> with precision.
                </h1>
            </div>
            <!-- Presence Indicator Simulation -->
            <div
                class="z-10 flex items-center gap-4 bg-surface-container-lowest/70 backdrop-blur-xl p-6 rounded-full w-fit shadow-[0_12px_32px_rgba(62,50,211,0.08)] ghost-border">
                <div class="flex -space-x-3">
                    <div class="relative w-10 h-10 rounded-full border-2 border-white overflow-hidden">
                        <img alt="Collaborator" class="w-full h-full object-cover"
                            data-alt="Close-up portrait of a woman with professional lighting and a soft neutral background for a profile photo"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAa-TcOXmNPTwA_mCliQLi665pGttz86Ivc_kMFwSnisBrNTcPVpHUKY6IY_EuELOJS66YrzYZeuCWEOqMBH5g_xEL4Fsj4MaLxnDHTR3ZIsk98Y2I8W1r8J4GVEUGM8iWPjYXzBAzQI3YBJQm81O8C093WNEfEa_zSzq1VEi8PaSnXUrmEcP6vegDDqB1_0xngEFX_s1s8sJp13b1yyNcJEM9xdoeAXx1HnvDA5F7_GdW_VWOWrEMgKiDYXiv-12WccdnRjLrTS5a6" />
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-primary border-2 border-white rounded-full">
                        </div>
                    </div>
                    <div class="relative w-10 h-10 rounded-full border-2 border-white overflow-hidden">
                        <img alt="Collaborator" class="w-full h-full object-cover"
                            data-alt="Studio headshot of a smiling man against a clean light gray background for corporate profile"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDX0X2rw8kiV4j-HlPVKwWGGv0cZxz28cjmc8dQTiRbf7e7_-rZSnwgv9xWX48u4OMS2w6CvlDGSCOLvO3Gkml7NkCh0C9zx2uYSHiAO7w2NDJWLrZYMxRAun2fnAHco43o4LPk9jrCk-06JoivNqNVElr8xxlE1Mf9eNxbiwnC9S63r4Ja3V2IMcGc-PpJ01wQbwFoEBEZ0SXAE9lh-SVoqw1GIGajy-IHuZkQQx0RkH50hC69FKIsHP1Fvxj6DHWr8WDTpOrH8BQk" />
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-secondary border-2 border-white rounded-full">
                        </div>
                    </div>
                    <div
                        class="w-10 h-10 rounded-full border-2 border-white bg-primary-fixed flex items-center justify-center text-on-primary-fixed text-xs font-bold">
                        +12</div>
                </div>
                <div class="text-sm font-semibold text-on-surface-variant">Active in Workspace</div>
            </div>
            <!-- Background Aesthetic -->
            <div class="absolute top-0 right-0 w-full h-full opacity-10 pointer-events-none">
                <div class="absolute top-1/4 right-1/4 w-96 h-96 bg-primary blur-[120px] rounded-full"></div>
                <div class="absolute bottom-1/4 left-1/4 w-64 h-64 bg-tertiary blur-[100px] rounded-full"></div>
            </div>
        </section>
        <!-- Right Side: Interaction Layer (Focus) -->
        <section
            class="w-full md:w-1/2 flex flex-col justify-center items-center p-8 md:p-24 bg-surface-container-lowest">
            <div class="w-full max-w-sm">
                <!-- Mobile Logo -->
                <div class="md:hidden brand-logo text-2xl font-black text-primary tracking-tighter mb-8">CognitiveFlow
                </div>
                <div class="mb-10">
                    <h2 class="text-3xl font-bold text-on-surface mb-2">Welcome back</h2>
                    <p class="text-on-surface-variant text-sm font-medium">Continue your cognitive journey.</p>
                </div>
                <form class="space-y-6">
                    <!-- Email Input -->
                    <div class="space-y-2">
                        <label class="text-[0.6875rem] font-bold uppercase tracking-widest text-on-surface-variant ml-1"
                            for="email">Email Address</label>
                        <div class="relative">
                            <input
                                class="w-full h-14 px-5 bg-surface-container-lowest border-0 rounded-xl ring-1 ring-outline-variant/20 focus:ring-2 focus:ring-primary focus:bg-white transition-all duration-200 outline-none text-on-surface font-medium placeholder:text-slate-300"
                                id="email" placeholder="name@company.com" type="email" />
                        </div>
                    </div>
                    <!-- Password Input -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center ml-1">
                            <label class="text-[0.6875rem] font-bold uppercase tracking-widest text-on-surface-variant"
                                for="password">Password</label>
                            <a class="text-[0.6875rem] font-bold text-primary hover:text-primary-container transition-colors uppercase tracking-widest"
                                href="#">Forgot Password?</a>
                        </div>
                        <div class="relative">
                            <input
                                class="w-full h-14 px-5 bg-surface-container-lowest border-0 rounded-xl ring-1 ring-outline-variant/20 focus:ring-2 focus:ring-primary focus:bg-white transition-all duration-200 outline-none text-on-surface font-medium placeholder:text-slate-300"
                                id="password" placeholder="••••••••" type="password" />
                        </div>
                    </div>
                    <!-- Login Button -->
                    <button
                        class="w-full h-14 primary-gradient text-on-primary font-bold rounded-xl shadow-[0_8px_20px_rgba(62,50,211,0.2)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-200"
                        type="submit">
                        Sign In
                    </button>
                </form>
                <!-- Divider -->
                <div class="relative my-10 text-center">
                    <span
                        class="bg-surface-container-lowest px-4 text-[0.6875rem] font-bold text-on-surface-variant uppercase tracking-widest relative z-10">Or
                        connect with</span>
                    <div class="absolute top-1/2 left-0 w-full h-[1px] bg-surface-container-high -z-0"></div>
                </div>
                <!-- Social Login Buttons -->
                <div class="grid grid-cols-2 gap-4">
                    <button
                        class="flex items-center justify-center gap-2 h-12 bg-surface-container-low hover:bg-surface-container-high text-on-surface text-sm font-semibold rounded-xl transition-colors">
                        <svg class="w-5 h-5" viewbox="0 0 24 24">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                fill="#4285F4"></path>
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853"></path>
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                fill="#FBBC05"></path>
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335"></path>
                        </svg>
                        Google
                    </button>
                    <button
                        class="flex items-center justify-center gap-2 h-12 bg-surface-container-low hover:bg-surface-container-high text-on-surface text-sm font-semibold rounded-xl transition-colors">
                        <svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
                            <path
                                d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.341-3.369-1.341-.454-1.152-1.11-1.459-1.11-1.459-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z">
                            </path>
                        </svg>
                        GitHub
                    </button>
                </div>
                <!-- Footer Text -->
                <p class="mt-12 text-center text-sm text-on-surface-variant font-medium">
                    Don't have an account?
                    <a class="text-primary font-bold hover:underline" href="#">Create for free</a>
                </p>
            </div>
        </section>
    </main>
    <!-- Support Floating Action -->
    <div class="fixed bottom-8 right-8">
        <button
            class="w-12 h-12 flex items-center justify-center bg-surface-container-lowest rounded-full shadow-[0_12px_32px_rgba(62,50,211,0.12)] ghost-border hover:bg-surface-container-low transition-colors group">
            <span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform"
                data-icon="help_center">help_center</span>
        </button>
    </div>
</body>

</html>
